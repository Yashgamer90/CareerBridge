<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Login | CareerBridge</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main class="auth-page">
        <section class="auth-card"><a class="cb-brand" href="index.html"><span
                    class="cb-logo">CB</span>CareerBridge</a><span class="hero-badge" style="margin-top:22px">WELCOME
                BACK</span>
            <h1>Login to CareerBridge</h1>
            <p>Continue your job search and applications.</p>
            <form id="loginForm"><label>Email</label><input id="email" type="email" required
                    placeholder="name@example.com"><label>Password</label><input id="password" type="password" required
                    placeholder="Your password"><button class="cb-btn cb-btn-primary" type="submit">Sign In</button>
            </form>
            <p class="auth-message">New here? <a href="register.html" style="color:#275df5;font-weight:700">Create
                    account</a></p>
        </section>
    </main>
    <script src="backend.js"></script>
</body>

</html>
